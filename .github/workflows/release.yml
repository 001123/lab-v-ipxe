name: Release Binary

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.0.0)'
        required: false
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag_name || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-frontend:
    name: Build Frontend UI
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      version: ${{ steps.vars.outputs.version }}
      commit_sha: ${{ steps.vars.outputs.commit_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Version and Update Files
        id: vars
        shell: bash
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v0.0.0-${GITHUB_SHA:0:7}"
          fi

          if [[ ! "$TAG" =~ ^v ]]; then
            TAG="v${TAG}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          # Only commit and push if it's a valid release tag (e.g. v1.0.0)
          if [[ "$TAG" =~ ^v[0-9] ]]; then
            echo "==> Preparing release version ${VERSION} for tag ${TAG}..."

            # Switch to main branch to push clean history
            git checkout main || git checkout -b main origin/main
            git pull origin main --rebase || true

            chmod +x scripts/bump_version.sh
            ./scripts/bump_version.sh "${VERSION}"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add web/package.json web/package-lock.json v.mod internal/config/config.v
            if ! git diff --staged --quiet; then
              echo "==> Committing bumped version ${VERSION} to main..."
              git commit -m "chore(release): bump version to ${VERSION} [skip ci]"
              git push origin main
              git tag -fa "${TAG}" -m "Release ${TAG}"
              git push origin "${TAG}" --force
            else
              echo "==> Version files already up to date, skipping commit."
            fi
          else
            echo "==> Non-release tag (${TAG}), skipping git commit."
          fi

          COMMIT_SHA=$(git rev-parse HEAD)
          echo "commit_sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build Next.js static export
        working-directory: web
        run: npm run build

      - name: Upload frontend assets
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: web/out
          retention-days: 1

  build-binaries:
    name: Build Binary (${{ matrix.target }})
    needs: build-frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: darwin-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.build-frontend.outputs.commit_sha }}

      - name: Download frontend assets
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: web/out

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libsqlite3-dev libssl-dev

      - name: Setup V
        uses: vlang/setup-v@v1.7
        with:
          check-latest: true

      - name: Verify V installation
        run: v version

      - name: Verify code formatting
        run: v fmt -verify .

      - name: Type-check
        run: v -check .

      - name: Generate embedded frontend assets
        run: v run scripts/gen_embed.vsh

      - name: Build production binary
        run: |
          mkdir -p bin
          v -prod -o bin/lab-v-ipxe .

      - name: Package release archive
        shell: bash
        run: |
          TAG="${{ needs.build-frontend.outputs.tag }}"
          ARCHIVE_NAME="lab-v-ipxe-${TAG}-${{ matrix.target }}"
          ARCHIVE_DIR="dist/${ARCHIVE_NAME}"

          mkdir -p "${ARCHIVE_DIR}"
          cp bin/lab-v-ipxe "${ARCHIVE_DIR}/"
          [ -f README.md ] && cp README.md "${ARCHIVE_DIR}/"
          [ -f LICENSE ] && cp LICENSE "${ARCHIVE_DIR}/"

          tar -czf "dist/${ARCHIVE_NAME}.tar.gz" -C dist "${ARCHIVE_NAME}"

          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"
          else
            shasum -a 256 "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    needs: [build-frontend, build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all binary artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: release-assets
          merge-multiple: true

      - name: Generate combined checksums.txt
        working-directory: release-assets
        run: |
          cat *.sha256 > checksums.txt
          rm -f *.sha256
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build-frontend.outputs.tag }}
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
